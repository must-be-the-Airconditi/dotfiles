# ==========================================
# MangoWM 核心配置 (安全兼容版)
# ==========================================

# --- 基础快捷键 ---
bind=SUPER,Return,spawn,kitty
bind=SUPER,t,spawn,kitty
bind=SUPER,d,spawn,fuzzel
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,e,quit
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,s,spawn,sh -c "$HOME/.config/niri/screenshot.sh"
bind=SUPER,w,spawn,sh -c "$HOME/.local/bin/wallpaper-pick"

# --- 焦点与窗口切换 ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# --- 音量与亮度控制 (Fn键) ---
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# --- Fcitx5 输入法环境变量 ---
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

# --- 开机自启动 ---
exec=fcitx5 -d

exec=sh -c "sleep 0.6 && $HOME/.local/bin/wallpaper"

exec=sh -c "pkill -x waybar; sleep 0.5; waybar"

exec=awww-daemon
# --- Mako 动画 ---
animation_type_close=slide
blur=1
blur_optimized=1
# --- Mako 动画结束 ---

exec=sh -c "sleep 2 && env DESKTOPINTEGRATION=1 $HOME/AppImages/devsidecar.appimage --no-sandbox"
# --- MangoWM 动画与图层动画 ---
# 开启普通窗口和图层表面（通知、面板）的动画总开关
animations=1
layer_animations=1

# 全局窗口打开/关闭动画类型
animation_type_open=slide
animation_type_close=slide

# 专门为图层表面（如 Mako 通知）设置滑入/滑出效果
layer_animation_type_open=slide
layer_animation_type_close=slide

# 控制动画节奏 (毫秒)
animation_duration_open=400
animation_duration_close=300

# 平滑的贝塞尔曲线，让滑动更自然
animation_curve_open=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# 可选：为动画叠加淡入淡出效果，视觉上会更柔和
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
